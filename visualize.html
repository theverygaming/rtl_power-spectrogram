<!DOCTYPE html>
<html>
    <head>
        <script>
            async function getMeta() {
                const resp = await fetch("out/meta.json");
                if (!resp.ok) {
                    throw new Error(`err fetching meta ${resp.status}`);
                }
                return await resp.json();
            }

            function prepareMeta(meta) {
                // sort by start frequency
                meta.sort((a, b) => {
                    return a.flow - b.flow;
                });
                // and each spec by start time
                meta.forEach(x => {
                    x.specs.sort((a, b) => {
                        return a.ts_start - b.ts_start;
                    });
                });
            }

            function throttle(cb, ms) {
                let tLastEvent = Date.now();
                let timeoutid = null;
                let latestArgs = null;
                return function(ev) {
                    latestArgs = arguments;
                    const tremaining = ms - (Date.now() - tLastEvent);

                    if (tremaining <= 0) {
                        if (timeoutid) {
                            clearTimeout(timeoutid);
                            timeoutid = null;
                        }
                        tLastEvent = Date.now();
                        cb.apply(null, latestArgs);
                    } else if (!timeoutid) {
                        timeoutid = setTimeout(() => {
                            timeoutid = null;
                            tLastEvent = Date.now();
                            cb.apply(null, latestArgs);
                        }, tremaining);
                    }
                };
            }

            async function main() {
                const meta = await getMeta();
                prepareMeta(meta);
                console.log(meta);

                // find all unique timestamps so we can prepare rows
                const row_timestamps = [...new Set(meta.map(m => m.specs.map(s => s.ts_start)).flat(1))];
                console.log(row_timestamps);

                row_timestamps.forEach(ts => {
                    const rowel = document.createElement("div");
                    rowel.classList = ["spectrum-row"];

                    meta.forEach(m => {
                        m.specs.forEach(s => {
                            if (s.ts_start != ts) {
                                return;
                            }
                            const img = document.createElement("img");
                            img.src = "out/" + s.fname;
                            img.dataset.ts_start = s.ts_start;
                            img.dataset.flow = m.flow;
                            img.dataset.fstep = m.fstep;
                            rowel.appendChild(img);
                        });
                    });
                    document.getElementById("spectrum").appendChild(rowel);
                });
                
                let mouseClientX = 0;
                let mouseClientY = 0;

                function updateFreq() {
                    const hoveredImages = document.elementsFromPoint(mouseClientX, mouseClientY).filter(el => el.tagName == "IMG");
                    if (!hoveredImages.length) {
                        return;
                    }
                    const img = hoveredImages[0];

                    const mousePageX = mouseClientX + window.pageXOffset;
                    const mousePageY = mouseClientY + window.pageYOffset;

                    // https://stackoverflow.com/a/34867233
                    const imgx = mousePageX - img.offsetLeft;
                    const imgy = mousePageY - img.offsetTop;

                    const ts_start = parseFloat(img.dataset.ts_start);
                    const flow = parseFloat(img.dataset.flow);
                    const fstep = parseFloat(img.dataset.fstep);

                    document.getElementById("infofreq").innerText = (new Intl.NumberFormat("en-US", {maximumFractionDigits: 0})).format(flow + (fstep * imgx));

                    document.getElementById("infotime").innerText = "~" + (new Date(ts_start * 1000)).toLocaleTimeString("en-US", {hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false});
                }

                const updateMs = 20;

                addEventListener("scroll", throttle((ev) => {
                    updateFreq();
                }, updateMs));

                document.getElementById("spectrumcontainer").addEventListener("mousemove", throttle((ev) => {
                    mouseClientX = ev.clientX;
                    mouseClientY = ev.clientY;
                    mousePageX = ev.pageX;
                    mousePageY = ev.pageY;
                    updateFreq();
                }, updateMs));
            }

            window.onload = function () {
                main();
            }
        </script>
        <style>
            #spectrumcontainer {
                left: 0;
                top: 0;
                position: absolute;
                display: block;

                margin: 0;
                cursor: crosshair;
            }

            #spectrum {
                display: flex;
                flex-direction: column; 
            }

            .spectrum-row {
                display: flex; 
                flex-direction: row;
            }

            #infocontainer {
                right: 0;
                top: 0;
                position: fixed;
                z-index: 10;
                border: 1px;
                border-style: solid;
                border-color: yellow;
                padding: 0.5em 0.5em 0.5em;
            }

            #info {
                color: yellow;
                font-size: 1.2em;
                font-family: monospace;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div id="infocontainer">
            <div id="info">
                <span id="infofreq"></span> <span>Hz</span>
                <br>
                <span id="infotime"></span>
            </div>
        </div>
        <div id="spectrumcontainer">
            <div id="spectrum"></div>
        </div>
    </body>
</html>
